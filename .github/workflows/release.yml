name: Release

# Publishes to crates.io on a version tag through trusted publishing: the
# crate's settings on crates.io name this repository, this workflow file,
# and the `release` environment, and the job exchanges its OIDC token for a
# short-lived crates.io token. No long-lived secret is stored.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
