name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [rust, pure-python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy, rustfmt
      # whenever 1.0 or later; the wheel carries the Rust extension, and the
      # pure-Python backend is selected at import time by the tests.
      - run: pip install "whenever>=1.0.0b0"
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The records alone, without jiff.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --all-features
        env:
          PYO3_WHENEVER_TEST_PURE: ${{ matrix.backend == 'pure-python' && '1' || '' }}
